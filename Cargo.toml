[package]
name = "stt"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
json-store = { git = "https://github.com/laroccacharly/json-store" }
notify-rust = "4.18.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustix = { version = "1.1.5", features = ["process"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "sync", "time", "fs", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

[profile.release]
strip = true
# Fast rebuilds (~2 s after an edit): reuse unchanged work between builds and
# skip LTO, ~2 s of cross-unit optimization this I/O-bound app doesn't need.
incremental = true
lto = "off"

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "process"] }
tokio-tungstenite = "0.30.0"
